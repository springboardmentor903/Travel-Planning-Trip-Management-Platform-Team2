spring.application.name=tripnest-backend
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/tripnext
spring.datasource.username=postgres
spring.datasource.password=your_password_here

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=your_jwt_secret_here_minimum_32_characters
jwt.expiration=86400000

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=your_google_client_id_here
spring.security.oauth2.client.registration.google.client-secret=your_google_client_secret_here
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google
