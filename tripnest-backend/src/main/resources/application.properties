spring.application.name=tripnest-backend
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/tripnest
spring.datasource.username=root
spring.datasource.password=Sushma939@23


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=your_jwt_secret_here_minimum_32_characters
jwt.expiration=86400000

# OpenWeather API
openweather.api.key=${OPENWEATHER_API_KEY}
openweather.api.url=https://api.openweathermap.org/data/2.5/weather

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=your_google_client_id_here
spring.security.oauth2.client.registration.google.client-secret=your_google_client_secret_here
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google4

# OpenStreetMap / Nominatim API
nominatim.api.url=https://nominatim.openstreetmap.org/search